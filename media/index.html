<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Sistema de Médias</title>
</head>
<body>
    <div class="caxa_mae">
        <div class="caxa_h1">
            <h1>Sistema Escolar -2026</h1>
        </div>
        <div class="caxa_input">
            <div>
                <label for="nota1">Digite a nota da 1ª unidade</label>
                <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="0.0">
            </div>
            <div>
                <label for="nota2">Digite a nota da 2ª unidade</label>
                <input type="number" id="nota2" step="0.1"
                min="0" max="10" placeholder="0.0">
            </div>
            <div>
                <label for="nota3">Digite a nota da 3ª unidade</label>
                <input type="number" id="nota3" step="0.1"
                min="0" max="10" placeholder="0.0">
            </div>
            <button id="acao">CALCULAR MÉDIA</button>
        </div>
        <div class="resultado">
            <div>
                <span>Média: </span>
                <span id="media">0,0</span>
            </div>
            <div>
                <span>Situação: </span>
                <span id="situacao"></span>
            </div>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
