<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Reze</title>
    <link rel="icon" type="image/png" href="img/calendar.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="primaria">
        <div><h1>PAINEL DIGITAL</h1></div>
        <div class="horas">
            <div>
                <span id="horas">00</span>
            </div>
            <span>:</span>
            <div>
                <span id="minutos">00</span>
            </div>
            <span>:</span>
            <div>
                <span id="segundos">00</span>
            </div>
        </div>
        <div class="data">
            <span id="dia">00</span>
            <span>/</span>
            <span id="mes">00</span>
            <span>/</span>
            <span id="ano">00</span>
        </div>
        <div class="data_sep">
            <div>
                <span class="text">DIA</span>
                <span class="valor" id="dia_sep">00</span>
            </div>
            <div>
                <span class="text">MÊS</span>
                <span class="valor" id="mes_sep">00</span>
            </div>
            <div>
                <span class="text">ANO</span>
                <span class="valor" id="ano_sep">00</span>
            </div>
        </div>
        <div id="mensagem" class="msg">
            <span>...</span>
        </div>
        <p>PAINEL ATUALIZADO AUTOMÁTICAMENTE</p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
